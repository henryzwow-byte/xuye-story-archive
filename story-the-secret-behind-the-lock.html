  <meta name="description" content="Three days after marrying Evan Whitmore, Emily Carter hears her apartment lock open and watches her mother-in-law Rebecca walk in as though the home already belongs to her. The invasion turns into a scalding assault, while Evan refuses to call for help and tries to seize the evidence hidden in Emily&#039;s locked desk. A red folder prepared before the wedding exposes forged signatures, financial schemes and a pattern of coercive control that reached back through Evan&#039;s family. With attorney Nora Vale and another former fiancée willing to testify, Emily carries the case into court and fights to reclaim not only her property, but the right to decide who may enter her life.">
