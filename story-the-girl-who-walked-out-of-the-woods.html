  <title>The Girl Who Walked Out of the Woods — Story Archive</title>
  <meta name="description" content="After a punishing hospital shift, nurse Sarah Whitaker returns home to see her seven-year-old daughter Maisie emerge barefoot from the woods, carrying her feverish little brother Theo. Their grandmother Joanne had left both children inside a hot car while she disappeared into a church office, and their cognitively impaired grandfather Curtis then tried to take Theo. Maisie fled through a broken fence and hid in the woods until she could carry her brother home. Church surveillance, phone records and GPS data expose the two-hour silence that followed, forcing Sarah to choose her children&#039;s safety over family reputation and to build a life where courage no longer has to fall on a child&#039;s shoulders.">
