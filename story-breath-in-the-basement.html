  <meta name="description" content="Locked in a basement with three broken ribs, Claire Moretti Hale uses a shattered phone to call her father, the feared logistics magnate Vincent Moretti. He arrives with police, medics and lawyers instead of gunmen, and the rescue exposes a calculated scheme by Claire&#039;s husband and his family to declare her unstable and seize her trust. To become free, Claire must confront both her husband&#039;s violence and the control her father once mistook for protection.">
