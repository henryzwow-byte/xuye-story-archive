  <meta name="description" content="Claire Moretti wakes in a burn unit after a fire kills her mother and leaves her father weeping beside the bed with immaculate cuffs. Pretending that smoke erased her memory, the forensic accountant quietly joins Detective Lena Ortiz and her partner Julian Price to follow the records her mother hid before her death. Insurance amendments, secret payments and a Northline risk file reveal that the blaze was not an accident, but the final move in a financial conspiracy. Claire must turn the ledger into testimony before her father destroys the last evidence and rewrites the family tragedy as his own rescue story.">
