  <meta name="description" content="At a lavish pre-wedding garden party, Vanessa Mitchell turns a hose on a drenched older woman and laughs when guests call the stranger a beggar. The woman is Eleanor Carter, founder of the hospitality empire paying nearly everyone at the estate—and she came in disguise after months of complaints about cruelty, coercive contracts and unsafe construction tied to Vanessa&#039;s family. A hidden recording, compromised surveillance, procurement files and the testimony of workers expose a scheme larger than one public humiliation. Eleanor must then decide how to pursue justice without turning wealth into its own excuse for cruelty, while her grandson Ethan confronts the loyalty that kept him from seeing what was in front of him.">
